<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IVC Publicador - Authorization</title><style>body{font-family:Arial,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;color:#222}code{word-break:break-all}</style></head><body>
<h1>IVC Publicador</h1>
